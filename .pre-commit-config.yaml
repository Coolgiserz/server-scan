# pre-commit 配置：Shell 脚本代码质量检查
# 安装: pip install pre-commit && pre-commit install
# 依赖: shellcheck, shfmt (需系统级安装)
#   CentOS/RHEL: yum install -y ShellCheck shfmt  (或 epel-release)
#   Ubuntu/Debian: apt install -y shellcheck shfmt

repos:
  # Shell 静态检查（语法错误、潜在 bug、最佳实践）
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.10.0
    hooks:
      - id: shellcheck
        args: ["--severity=warning"]

  # Shell 格式化（统一代码风格，自动格式化）
  - repo: https://github.com/pecigonzalo/pre-commit-shfmt
    rev: v2.2.0
    hooks:
      - id: shell-fmt
        args: ["-i", "4"]  # 4 空格缩进，自动格式化

  # 通用检查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace      # 行尾空格
      - id: end-of-file-fixer        # 文件末尾换行
      - id: check-yaml               # YAML 语法检查
      - id: check-added-large-files  # 防止提交大文件
      - id: check-merge-conflict     # 防止提交合并冲突标记
      - id: mixed-line-ending        # 统一换行符为 LF
